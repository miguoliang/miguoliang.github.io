name: Daily clip (auto)

# Daily clip content is now produced by the 运营数据 agent / Cloud Agent.
# This workflow is optional manual backup; site build remains "Deploy to GitHub Pages".
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-clip
  cancel-in-progress: false

jobs:
  auto-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare today's candidate
        id: prep
        run: |
          set -euo pipefail
          node scripts/prepare-daily-candidate.mjs | tee prep.log
          if grep -q '^READY$' prep.log; then
            echo "has_candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_candidate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Cursor CLI
        if: steps.prep.outputs.has_candidate == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Write clip with Cursor Agent
        if: steps.prep.outputs.has_candidate == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="$(node scripts/build-cursor-prompt.mjs)"
          agent -p --force --output-format text --model "${CLIP_CURSOR_MODEL:-composer-2.5}" "$PROMPT"

      - name: Validate links
        if: steps.prep.outputs.has_candidate == 'true'
        run: npm run check:links

      - name: Commit and push
        if: steps.prep.outputs.has_candidate == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/clippings/
          if git diff --staged --quiet; then
            echo "Cursor agent did not create a clipping file."
            exit 1
          fi
          EDITION=$(node -p "JSON.parse(require('fs').readFileSync('data/daily-candidate.json','utf8')).edition")
          git commit -m "clip: auto daily ${EDITION}"
          git push origin HEAD:main

      - name: Trigger site deploy
        if: steps.prep.outputs.has_candidate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
