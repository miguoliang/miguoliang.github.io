name: Daily clip (auto)

on:
  schedule:
    # 每天 09:00 (UTC+8) = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-clip
  cancel-in-progress: false

jobs:
  auto-clip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily clip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIP_LLM_PROVIDER: ${{ vars.CLIP_LLM_PROVIDER || 'anthropic' }}
          CLIP_LLM_MODEL: ${{ vars.CLIP_LLM_MODEL }}
        run: node scripts/auto-daily-clip.mjs --commit

      - name: Push to main
        run: |
          if git rev-list --count origin/main..HEAD 2>/dev/null | grep -qv '^0$'; then
            git push origin HEAD:main
          else
            echo "No new commit to push."
          fi
